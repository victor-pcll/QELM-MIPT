# @package _global_

# Brickwork circuit of random U(1) two-qubit gates, a phase on |00> and |11> and
# a Haar 2 x 2 block on {|01>, |10>} (QELM.models.circuits.haar.U1BrickworkCircuit,
# issues #137 and #239): the charge-conserving circuit of Agrawal et al. (2022)
# and Barratt et al. (2022). It is the U(1) reference next to the Haar
# brickwork and the Floquet chain in the entropy experiment
# (experiments/QELM_S), with models=U1_circuit. The gates act on the Ns system
# qubits only, never on the Nr ancillas. conf/charge_sharpening.yaml has its
# own U1_circuit block, with the scrambling layers of the paper.
models: U1_circuit

# Total number of qubits, ancilla included (N = Ns + Nr, see conf/config.yaml).
# Override it with N=6, not U1_circuit.N=6.
N: 10

U1_circuit:
  N: ${N} # number of qubits, always the top-level N
  Nr: ${Nr} # ancillas, left untouched by the gates
  # Brickwork layers per time-evolution step, each a full period (gates on
  # the even bonds, then on the odd ones), each with its own gates.
  layers_per_step: 1
  boundary: open # open or periodic
  # false: new gates for every sample; true: one draw for every sample.
  fixed_instance: false
