# @package _global_

# Transverse-field Ising model: H = h * sum_i Z_i + sum_{i<j} J_ij X_i X_j,
# with J_ij uniform in [-J/2, J/2]. Add another file in this directory to add a model.
# ${mul:...}, ${div:...} and ${int:...} are defined in src/QELM/resolvers.py.
# Derived values follow their source (TFIM.J=2 rescales h, t and dt) and can
# still be overridden directly (TFIM.h=5).
models: TFIM

# Total number of qubits, ancilla included (N = Ns + Nr, see conf/config.yaml).
# Override it with N=6, not TFIM.N=6.
N: 10

# Hamiltonian
TFIM:
  N: ${N} # number of qubits, always the top-level N
  J: 1.0 # coupling scale Js, the energy unit
  h: ${mul:10.0,${TFIM.J}} # transverse field, h = 10 Js
  RUNS: 10 # number of random Hamiltonians (disorder realisations)

# Unitary evolution step and step count, recorded by the pipeline (evolution_request).
evolution:
  t: ${div:10.0,${TFIM.J}} # total evolution time, t = 10 / Js
  n_steps: ${mul:4,${N}} # d, number of time cuts, d = 4 N
  dt: ${div:${evolution.t},${evolution.n_steps}} # step, dt = t / d
