# @package _global_

# Transverse-field Ising model, with J_ij uniform in [-J/2, J/2]:
#   basis X (default): H = h * sum_i Z_i + sum_{i<j} J_ij X_i X_j
#   basis Z:           H = -h * sum_i X_i - sum_{i<j} J_ij Z_i Z_j
# Add another file in this directory to add a model.
# ${mul:...}, ${div:...} and ${int:...} are defined in src/QELM/resolvers.py.
# Derived values follow their source (TFIM.J=2 rescales h, t and dt) and can
# still be overridden directly (TFIM.h=5).
models: TFIM

# Number of system qubits, ancilla excluded (N_total = N + Nr, see
# conf/config.yaml). Override it with N=6, not TFIM.N=6.
N: 10

# Hamiltonian
TFIM:
  N: ${N} # number of system qubits, always the top-level N
  J: 1.0 # coupling scale Js, the energy unit
  h: ${mul:10.0,${TFIM.J}} # transverse field, h = 10 Js
  basis: X # X: quantum information convention, Z: condensed matter (TFIM.basis=Z)
  RUNS: 10 # number of random Hamiltonians (disorder realisations)

# Unitary evolution step and step count, recorded by the pipeline (evolution_request).
evolution:
  t: ${div:10.0,${TFIM.J}} # total evolution time, t = 10 / Js
  n_steps: ${mul:4,${N}} # d, number of time cuts, d = 4 N (system qubits)
  dt: ${div:${evolution.t},${evolution.n_steps}} # step, dt = t / d
