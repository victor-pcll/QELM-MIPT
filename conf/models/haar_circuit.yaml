# @package _global_

# Brickwork circuit of Haar-random two-qubit gates, each a 4 x 4 unitary drawn from the Haar
# measure on U(4) (QELM.models.circuits.HaarBrickworkCircuit, issue #171).
# It replaces the TFIM as the unitary dynamics of the QELM experiments on the
# measurement record (experiments/QELM_M), with models=haar_circuit. The gates
# act on the Ns system qubits only, never on the Nr ancillas.
models: haar_circuit

# Total number of qubits, ancilla included (N = Ns + Nr, see conf/config.yaml).
# Override it with N=6, not haar_circuit.N=6.
N: 10

haar_circuit:
  N: ${N} # number of qubits, always the top-level N
  Nr: ${Nr} # ancillas, left untouched by the gates
  # Brickwork layers per time-evolution step, each a full period (gates on
  # the even bonds, then on the odd ones), each with its own gates. A sample
  # runs projective_measurement.nbr_time_evolution * layers_per_step layers.
  layers_per_step: 1
  boundary: open # open or periodic
  # false: new gates for every sample, as the TFIM draws a new disorder per
  # sample; true: one draw of the gates for every sample, set by the seed.
  fixed_instance: false
