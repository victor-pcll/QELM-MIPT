# @package _global_

# Scaffold so the dispatcher can route to the Kitaev model.
# N is required by every model. Other Hamiltonian parameters are not implemented yet.
sim_type: kitaev
kitaev:
  N: 4

# Evolution step and step count, recorded by the pipeline (evolution_request).
test:
  dt: 0.01
  n_steps: 100
