# The tree under conf/ mirrors src/QELM/: models/ for QELM.models, and
# training/{measurements,readout,regression}/ for the QELM.training subpackages.
# Select a file with its group path, e.g. models=kitaev or
# training/regression=linear.
defaults:
  - models: TFIM
  - training/measurements: projective
  - training/readout@single_observable: single
  - training/readout@double_observable: double
  - training/regression: ridge
  - evaluation: default
  - _self_

# Shared experiment settings. Model-specific parameters live in conf/models/.
# Scalar seed applied once at startup. Override with seed=0 on the command line.
seed: 42

# Qubit counts (issue #88). N is the total number of qubits, ancilla included;
# it is set by the selected model file (conf/models/) and overridden with N=6.
# Nr is the number of ancilla (readout) qubits, the first sites of the chain.
# Ns, the number of system qubits, is never set by hand: Ns = N - Nr.
# Every block that needs a qubit count interpolates these three keys, and
# load_config and the scripts check that they agree (QELM.config).
Nr: 1
Ns: ${int:${sub:${N},${Nr}}}

# Initial state of the reservoir (QELM.encoding), on all N qubits.
ancilla_charge_sector:
  N: ${N}

# Simulated object of experiments/QELM_Q/exp_QELM_Q.py (issue #183): density
# follows the density matrix rho, vector the state vector psi, which stays pure
# and costs O(2**N) instead of O(4**N). Both give the same results for a seed.
# Override with state_representation=vector.
state_representation: density

# The evolution block (evolution.t, evolution.dt, evolution.n_steps) depends on the
# Hamiltonian, so it lives in conf/models/ next to it.

# The number of time-evolution steps between measurements,
# projective_measurement.nbr_time_evolution, lives with the measurement in
# conf/training/measurements/projective.yaml (issue #132).

# Samples. Not read by the pipeline yet.
samples:
  L: 10000 # number of samples
  # Ratio of samples to qubits (issue #201): when set, experiments/QELM_Q
  # replaces L by int(delta * N), so that the data grow with the number of
  # features of the readout. Override with samples.delta=200.
  delta: null
  train_fraction: 0.7
  train_size: ${int:${mul:${samples.train_fraction},${samples.L}}} # int(0.7 * L)

# Observables on the final state (single_observable, double_observable) live in
# conf/training/readout/, the projective measurement (projective_measurement) in
# conf/training/measurements/, and the trainer (training) in
# conf/training/regression/.

# Checkpoint written at the end of every run. No secrets belong here.
# dir: null uses Hydra's timestamped run directory when a job is active,
# otherwise <fallback_root>/<uuid>/.
checkpoint:
  dir: null
  fallback_root: outputs
  use_uuid: false
  filename: checkpoint.npz

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
