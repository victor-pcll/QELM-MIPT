# @package projective_measurement

# Projective measurement in the Z basis (QELM.training.measurements).
# qubits: list of measured sites in order, or null for every system qubit
#   (Nr .. N-1).
# Nr: ancilla qubits at the start of the chain, never measured by default.
#   It follows the top-level Nr; 1 matches AncillaChargeSectorEncoding.
# p: probability of measuring each target qubit; measure(rho, p=...) overrides it.
# nbr_time_evolution: number of time-evolution steps of length
#   evolution.t / nbr_time_evolution, each followed by a measurement of the
#   system, read by experiments/QELM_M/exp_QELM_M.py (issues #123, #132).
#   Independent of N, Ns and Nr. Override with
#   projective_measurement.nbr_time_evolution=10.
qubits: null
Nr: ${Nr}
p: 1.0
nbr_time_evolution: 5
# final_measurement: also measure after the last step, read by
#   experiments/QELM_Q/exp_QELM_Q.py only (issue #163). false: the
#   measurements are intermediate and the features are read after a last
#   unitary step. Override with projective_measurement.final_measurement=true.
final_measurement: false
