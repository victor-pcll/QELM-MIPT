# @package weak_measurement

# Weak measurement of the charge of single qubits (QELM.training.measurements.weak),
# as in Agrawal et al., PRX 14, 041012 (2024) (issue #137). Kraus operators
#   K_1 = sin(gamma pi / 2) |1><1|                  (click: the qubit is charged)
#   K_0 = |0><0| + cos(gamma pi / 2) |1><1|         (no click)
# gamma: measurement strength in [0, 1]; 0 learns nothing, 1 is projective.
# qubits: list of measured sites in order, or null for every system qubit
#   (sites Nr .. N_total - 1).
# Nr: ancilla qubits at the start of the chain, never measured by default.
gamma: 0.5
qubits: null
Nr: ${Nr}
