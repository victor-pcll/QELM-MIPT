# Purification decoding with a ridge decoder (issue #247). Primary config of
# experiments/QELM_R/exp_QELM_R.py: the main config, with the block below.
#
#   uv run python experiments/QELM_R/exp_QELM_R.py models=haar_circuit N=8
defaults:
  - config
  - _self_

# One ancilla: the reference qubit R, qubit 0, maximally entangled with the
# central system qubit at t = 0 and never acted on afterwards (the gates and
# the measurements touch the N system qubits only). N follows the model file
# unless set here or on the command line.
Nr: 1
N: 8

# Ridge regularization of the decoder (sklearn.linear_model.Ridge, intercept
# not penalized). Larger than the 1e-3 of the other experiments: the record
# has n_rounds * N features, close to the number of training trajectories.
training:
  alpha: 1.0

purification_task:
  # Measurement probabilities. Each p gets its own dataset of samples_per_p
  # trajectories and its own decoder, split with samples.train_fraction.
  # samples.L is not read.
  p_values: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.7, 1.0]
  samples_per_p: 500
  # Rounds of (unitary step, measurement of each system qubit with
  # probability p). null: 2 * N. A circuit applies <model>.layers_per_step
  # brickwork layers per round.
  n_rounds: null
  # TFIM only: time of one unitary step, in units of 1 / TFIM.J.
  dt: 1.0
  # true: one draw of the dynamics (TFIM couplings or circuit gates) for every
  # trajectory of the run, set by the seed: the fixed reservoir of the QELM,
  # whose map from the record to R the decoder can learn. false: new dynamics
  # per trajectory.
  fixed_instance: true
  # Phase boundary drawn on the figures, or null. About 0.17 for the
  # purification transition of the Haar brickwork (Gullans & Huse 2020;
  # Zabalo et al. 2020); not known for the TFIM reservoir.
  p_c: null
