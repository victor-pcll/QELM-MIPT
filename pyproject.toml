[project]
name = "qrc-env-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "victor-pcll", email = "victor.peucelle@epfl.ch" }
]
requires-python = ">=3.10"
dependencies = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.10.9",
    "netket>=3.17.1",
    "numpy>=2.2.6",
    "pennylane>=0.42.3",
    "qiskit>=2.5.2",
    "scipy>=1.15.3",
]

[project.scripts]
qrc-env-template = "qrc_env_template:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
