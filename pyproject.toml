[project]
name = "qelm-mipt"
version = "0.1.0"
description = "Quantum extreme learning machine (QELM) and the measurement-induced phase transition (MIPT)"
readme = "README.md"
authors = [
    { name = "victor-pcll", email = "victor.peucelle@epfl.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.7",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "tqdm>=4.70.1",
    "ipywidgets>=8.1.9",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import package is src/QELM, not the default derived from the project name.
module-name = "QELM"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "scipy-stubs>=1.18.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["QELM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/QELM", "main.py", "experiments/example/run_experiment.py"]
disallow_untyped_defs = true
warn_unused_ignores = true
explicit_package_bases = true
