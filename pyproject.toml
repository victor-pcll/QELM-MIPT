[project]
name = "qrc-env-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "victor-pcll", email = "victor.peucelle@epfl.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.7",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["qrc_env_template"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/qrc_env_template", "main.py"]
disallow_untyped_defs = true
warn_unused_ignores = true
explicit_package_bases = true
